lexer.*.r=r

# keywords (reserved words plus ..., ..1, ..2, etc.)
keywords.*.r=if else function NA_integer_ ... ..1 ..2 ..123
# functions from base-priority R-packages (base, stats, methods, graphics, utils, tools, etc.)
keywords2.*.r=abbreviate cbind data.frame head is.environment is.null library list print seq seq_len sqrt
# functions from recommended-priority R-packages (lattice, codetools, cluster, foreign, etc.)
keywords3.*.r=densityplot histogram
# non-function objects (constants)
keywords4.*.r=.__S3MethodsTable__. .GlobalEnv .Machine acme letters month.name pi singer
# user-defined functions/objects
keywords5.*.r=tidyverse_packages

fold=1
fold.compact=1

match AllStyles.r
	lexer.r.escape.sequence=1
match EscapeLexterTests.r
	lexer.r.escape.sequence=1
match NoUnicode.r
	lexer.r.unicode.identifiers=0
